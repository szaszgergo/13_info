<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <title>Table2</title>
</head>
<body>
    <table id="tablazat">
        <!--   <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr> -->
      
    </table>
    <script>
        const Adatok = [
            {
                id: "1",
                name: "Zámbó Jimmy",
                email: "jimmy@kiraly.hu"
            },
            {
                id: "2",
                name: "Korda György",
                email: "gyuri@repter.hu"
            },
            {
                id: "3",
                name: "Balázs Klári",
                email: "klari@repter.hu"
            },
            {
                id: "4",
                name: "Ganxsta Zolee",
                email: "zolee@kartel.hu"
            },
            {
                id: "5",
                name: "Bódi Guszti",
                email: "guszti@mulatos.hu"

            }
        ]
        document.querySelector('body').onload = function() {
            addTH(Adatok); // Csak egyszer hoz létre TH elemeket
            addTR(Adatok); // Az összes adatot sorokba helyezi
};
        


        function addTR(arr) {
        arr.map(item => { 
        let tr = document.createElement('tr');
        tablazat.appendChild(tr);

        const keys = Object.keys(item);
        keys.map(key => {
            addTD(tr, item[key]); 
        });
    });
}

function addTH(arr){
    let tr = document.createElement('tr'); 
    tablazat.appendChild(tr);

    const keys = Object.keys(arr[0]);
    keys.map(key => {
        let th = document.createElement('th');
        th.textContent = key;
        tr.appendChild(th);
    });
}



        function addTD(parent, szoveg) {
            let td = document.createElement("td")
            td.innerHTML = szoveg
            parent.appendChild(td)
        }
    </script>    
</body>
</html>
